# Builds Hollyland Web UI and publishes it to GitHub Pages:
# https://khromov.github.io/hollyland-web-ui/
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions"
# (or: gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running deployment finish instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run check

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      # The project site is served from /<repo>/ (here /hollyland-web-ui/); configure-pages reports
      # that path ("" for a custom domain), so forks and custom domains build correctly too.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
